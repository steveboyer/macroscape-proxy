version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns:
          - '@aws-sdk/*'
      aws-cdk:
        patterns:
          - 'aws-cdk-lib'
          - 'constructs'
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Prettier 3.9.x never converges on issues.md; see the TypeScript 6 / prettier pin commit.
      - dependency-name: prettier
        versions: ['>=3.9.0']
